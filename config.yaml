# Everything tunable lives here. Secrets (ANTHROPIC_API_KEY) go in .env.
models:
  prep: claude-opus-5-5
  interviewer: claude-sonnet-5-5
  report: claude-opus-5-5
interview:
  default_duration_min: 45
  proactive_cooldown_s: 45
  max_proactive_per_5min: 3
  silence_nudge_s: {clarify: 45, approach: 45, implement: 90, test: 60}
  run_reaction_delay_s: 3
  stuck_failing_runs: 3       # failing Runs in a row that count as stuck (so does the same exception twice)
  coding_pause_lines: 25      # lines changed since the last walkthrough request...
  coding_pause_idle_s: 30     # ...then this long without an edit or Run
  muted_silence_multiplier: 2
  utterance_settle_s: 1.5     # quiet after a spoken fragment before it is answered (fragments of one thought share one call)
  user_phase_lock_s: 120
  timeout_grace_s: 60
  abandon_after_idle_min: 10
  style_presets: [faang_standard, friendly_new_grad, pragmatic_startup]
runner:
  python: python3       # system interpreter, not the backend venv; stdlib only
  timeout_s: 10
  memory_mb: 512
  output_cap_kb: 64
voice:
  stt: webspeech        # webspeech | whisper (v2)
  tts: browser          # browser | off
  tts_voice: null       # a speechSynthesis voice name (e.g. "Google US English"); null = browser default
  tts_rate: 1.0         # speech rate, 0.1-10
  utterance_silence_ms: 1200
  pause_stt_during_tts: false   # fallback for speakers; disables barge-in
storage:
  db_path: data/interviews.db
